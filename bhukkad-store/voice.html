<style>
        /* Custom Animations for AI Pulse */
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .animate-pulse-ring-1 { animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .animate-pulse-ring-2 { animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 0.8s; }
        .animate-pulse-ring-3 { animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.6s; }

        /* Bhukkad Radiant Saffron & Mint Orb */
        .bhukkad-ai-orb {
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffc0a8 0%, #ff5722 35%, #b02f00 70%, #006b5c 100%);
            box-shadow:
                inset 0 0 6px rgba(255, 230, 200, 0.9),
                0 0 20px rgba(255, 87, 34, 0.5),
                0 4px 14px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .bhukkad-ai-orb::after {
            content: '';
            position: absolute;
            top: 6%;
            left: 14%;
            width: 42%;
            height: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 80%);
            transform: rotate(-25deg);
            pointer-events: none;
        }

        @keyframes bhukkadOrbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bhukkad-ai-orb.spinning {
            animation: bhukkadOrbSpin 4s linear infinite;
        }

        .bhukkad-ai-orb.calling {
            animation: bhukkadOrbSpin 2.5s linear infinite;
            box-shadow: 
                inset 0 0 8px rgba(255, 255, 255, 0.9),
                0 0 32px rgba(255, 87, 34, 0.9),
                0 0 55px rgba(0, 107, 92, 0.5);
        }

        /* Modern Gradient Background */
        .bg-futuristic-mesh {
            background-image: 
                radial-gradient(at 20% 0%, rgba(255, 87, 34, 0.05) 0px, transparent 50%),
                radial-gradient(at 80% 100%, rgba(104, 250, 221, 0.08) 0px, transparent 50%);
            background-color: #fcf9f8;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

<div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-secondary-container/10 rounded-full blur-[120px] pointer-events-none"></div>

<script type="module">
  import { addToCart, applyCoupon, setLastOrder, apiBase } from "./assets/cart-state.js";

  let ws = null;
  let audioContext = null;
  let micStream = null;
  let processor = null;
  let isRecording = false;
  let isPlaying = false;
  let audioQueue = [];

  function connectWS() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    const api = apiBase().replace(/^https?:\/\//, "");
    const wsUrl = "ws://" + api + "/ws/voice";
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        type: "init",
        config: {
          model_key: "openai-lite",
          tts_provider: "elevenlabs",
          tts_voice: "Sarah",
          use_rag: true,
          tools_enabled: true,
        }
      }));
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === "ready") {
          document.getElementById("micStatusText").textContent = "AI Chef Ready. Tap mic!";
        } else if (msg.type === "transcript") {
          if (msg.role === "user") appendUserMsg(msg.text);
          else if (msg.role === "assistant") appendAIMsg(msg.text);
        } else if (msg.type === "audio") {
          audioQueue.push(msg.audio);
          if (!isPlaying) playNext();
        } else if (msg.type === "tool_call") {
          if (msg.name === "add_to_cart") {
            addToCart(msg.arguments.product, msg.arguments.tier || "Standard", msg.arguments.seats || 1);
          } else if (msg.name === "apply_coupon") {
            applyCoupon(msg.arguments.coupon_code);
          } else if (msg.name === "checkout" && msg.result?.order_id) {
            setLastOrder(msg.result);
          }
        }
      } catch (err) { console.error(err); }
    };
  }

  function escapeHtml(s = "") {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function appendUserMsg(text) {
    const feed = document.getElementById("transcriptFeed");
    const d = document.createElement("div");
    d.className = "self-end max-w-[85%]";
    d.innerHTML = `<div class="glass-panel px-lg py-md rounded-3xl rounded-br-sm shadow-sm text-on-surface font-body-lg">${escapeHtml(text)}</div>`;
    feed.appendChild(d);
    feed.scrollTop = feed.scrollHeight;
  }

  function appendAIMsg(text) {
    const feed = document.getElementById("transcriptFeed");
    const d = document.createElement("div");
    d.className = "self-start max-w-[85%] flex items-end gap-sm";
    d.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center shadow-md flex-shrink-0 mb-1">
        <span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
      </div>
      <div class="bg-secondary-container text-on-secondary-container px-lg py-md rounded-3xl rounded-bl-sm shadow-sm font-body-lg">
        ${escapeHtml(text)}
      </div>
    `;
    feed.appendChild(d);
    feed.scrollTop = feed.scrollHeight;
  }

  function playNext() {
    if (!audioQueue.length) { isPlaying = false; return; }
    isPlaying = true;
    const chunk = audioQueue.shift();
    const a = new Audio("data:audio/mp3;base64," + chunk);
    a.onended = () => playNext();
    a.onerror = () => playNext();
    a.play().catch(() => playNext());
  }

  async function toggleRec() {
    if (isRecording) {
      isRecording = false;
      document.getElementById("micStatusText").textContent = "Tap mic to speak";
      document.getElementById("micStatusText").classList.remove("animate-pulse");
      ["pulseRing1", "pulseRing2", "pulseRing3"].forEach(id => document.getElementById(id).style.opacity = "0");
      if (processor) processor.disconnect();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
    } else {
      if (!ws || ws.readyState !== WebSocket.OPEN) connectWS();
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(micStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) => {
          if (!isRecording || !ws || ws.readyState !== WebSocket.OPEN) return;
          const input = e.inputBuffer.getChannelData(0);
          const pcm16 = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++) {
            const s = Math.max(-1, Math.min(1, input[i]));
            pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
          ws.send(JSON.stringify({ type: "audio_chunk", data: b64 }));
        };

        source.connect(processor);
        processor.connect(audioContext.destination);

        isRecording = true;
        document.getElementById("micStatusText").textContent = "Listening...";
        document.getElementById("micStatusText").classList.add("animate-pulse");
        ["pulseRing1", "pulseRing2", "pulseRing3"].forEach(id => document.getElementById(id).style.opacity = "1");
      } catch (err) {
        console.error("Mic error", err);
        document.getElementById("micStatusText").textContent = "Microphone access denied or unavailable.";
      }
    }
  }

  document.getElementById("micButton").addEventListener("click", toggleRec);

  document.querySelectorAll(".voice-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      const text = btn.getAttribute("data-prompt");
      appendUserMsg(text);
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        connectWS();
        setTimeout(() => ws.send(JSON.stringify({ type: "text_input", text })), 500);
      } else {
        ws.send(JSON.stringify({ type: "text_input", text }));
      }
    });
  });

  connectWS();
</script>
